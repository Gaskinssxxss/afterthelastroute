name: quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Install pinned Containerlab for schema validation
        run: |
          curl -fsSLo /tmp/containerlab.deb https://github.com/srl-labs/containerlab/releases/download/v0.80.0/containerlab_0.80.0_linux_amd64.deb
          sudo apt-get install -y /tmp/containerlab.deb
      - run: make lint
      - run: containerlab validate -t topology.clab.yml
      - name: Check scripts and Python syntax
        run: |
          bash -n scripts/lab
          bash -n scripts/lint
          bash -n tests/acceptance.sh
          python -m py_compile examples/python/inspect.py
      - name: Check for likely secret material
        run: '! rg -n -i "(password\s*=|api[_-]?key\s*=|BEGIN (RSA |OPENSSH )?PRIVATE KEY)" --glob "!LICENSE" .'
