name: routing integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    # Register an ephemeral disposable Linux runner with these labels.
    # Docker/Containerlab access is root-equivalent; never use a shared host.
    runs-on: [self-hosted, linux, routing-lab-disposable]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run privileged real-network acceptance suite
        run: |
          make preflight
          make deploy
          ./tests/acceptance.sh
      - name: Tear down only this topology
        if: always()
        run: make destroy
