frr version 10.2.1
frr defaults traditional
hostname r2
service integrated-vtysh-config
!
interface eth1
 ip ospf network point-to-point
!
ip prefix-list REJECT-EXERCISE seq 5 permit 198.51.100.0/24
!
router ospf
 ospf router-id 10.255.0.2
 network 10.0.12.0/30 area 0
 network 10.255.0.2/32 area 0
!
router bgp 65010
 bgp router-id 10.255.0.2
 no bgp ebgp-requires-policy
 neighbor 10.255.0.1 remote-as 65010
 neighbor 10.255.0.1 update-source lo
 neighbor 10.0.23.2 remote-as 65020
 neighbor 10.0.23.2 timers 3 9
 neighbor 10.0.23.2 route-map FROM-AS65020 in
 address-family ipv4 unicast
  neighbor 10.255.0.1 next-hop-self
  neighbor 10.0.23.2 activate
 exit-address-family
!
route-map FROM-AS65020 deny 10
 match ip address prefix-list REJECT-EXERCISE
route-map FROM-AS65020 permit 100
!
line vty
!
