frr version 10.2.1
frr defaults traditional
hostname r3
service integrated-vtysh-config
!
interface eth2
 ip ospf network point-to-point
!
ip route 198.51.100.0/24 Null0
!
router ospf
 ospf router-id 10.255.0.3
 network 10.0.34.0/30 area 0
 network 10.255.0.3/32 area 0
!
router bgp 65020
 bgp router-id 10.255.0.3
 no bgp ebgp-requires-policy
 neighbor 10.255.0.4 remote-as 65020
 neighbor 10.255.0.4 update-source lo
 neighbor 10.0.23.1 remote-as 65010
 neighbor 10.0.23.1 timers 3 9
 address-family ipv4 unicast
  network 198.51.100.0/24
  neighbor 10.255.0.4 next-hop-self
  neighbor 10.0.23.1 activate
 exit-address-family
!
line vty
!
