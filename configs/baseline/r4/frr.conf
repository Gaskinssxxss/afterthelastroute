frr version 10.2.1
frr defaults traditional
hostname r4
service integrated-vtysh-config
!
interface eth1
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.4
 network 10.0.34.0/30 area 0
 network 10.255.0.4/32 area 0
!
router bgp 65020
 bgp router-id 10.255.0.4
 no bgp ebgp-requires-policy
 neighbor 10.255.0.3 remote-as 65020
 neighbor 10.255.0.3 update-source lo
 neighbor 10.0.14.1 remote-as 65010
 neighbor 10.0.14.1 timers 3 9
 address-family ipv4 unicast
  network 10.20.40.0/24
  neighbor 10.255.0.3 next-hop-self
  neighbor 10.0.14.1 activate
 exit-address-family
!
line vty
!
